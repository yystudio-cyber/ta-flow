<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>需求详情</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px 24px; color: #111827; }
  .row { display: flex; gap: 12px; padding: 4px 0; }
  .label__f8a { width: 120px; color: #6b7280; }
  .val__c2b { flex: 1; white-space: pre-wrap; }
  .ud__steps { display: flex; gap: 20px; margin: 12px 0 20px; }
  .ud__steps__item { color: #9ca3af; }
  .ud__steps__item--active { color: #4f46e5; font-weight: 600; }
  .ud-formily-item { margin: 14px 0; max-width: 720px; }
  .ud-formily-item-label { font-weight: 600; margin-bottom: 4px; }
  .ud-formily-item-control { display: flex; gap: 8px; align-items: center; }
  .ud-formily-item-help { color: #dc2626; font-size: 12px; margin-top: 4px; }
  .ud__select__selector {
    border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 10px; min-width: 220px;
    min-height: 20px; cursor: pointer; background: #fff; display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  }
  .ud__select__selector__placeholder { color: #9ca3af; }
  .ud__select__selector__selectItem { background: #eef2ff; border-radius: 4px; padding: 1px 6px; }
  .ud__select__dropdown {
    position: absolute; z-index: 999; background: #fff; border: 1px solid #e5e7eb;
    border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 4px 0; min-width: 220px; max-height: 260px; overflow: auto;
  }
  .ud__select__list__item, .ud__tree__node { padding: 6px 12px; cursor: pointer; }
  .ud__select__list__item:hover, .ud__tree__node:hover { background: #f3f4f6; }
  .ud__radio { margin-right: 16px; cursor: pointer; }
  .ud__switch { width: 40px; height: 20px; border-radius: 10px; background: #d1d5db; display: inline-block; cursor: pointer; }
  .ud__switch--checked { background: #4f46e5; }
  input[type=text], input[type=number], textarea { border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 10px; font: inherit; }
  .salary-unit { color: #6b7280; }
  header.bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
  button.ud__button { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit; }
  button.ud__button--primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ────────────────────────────────────────────────────────────────────────────
 * 飞书招聘「需求详情 → 新建职位三步向导」离线高保真夹具。
 *
 * 保真点全部来自 2026-08-03 真机侦察（租户 demo，实测走通三步）：
 *   · 「新建职位」是需求详情「关联职位」区块里的文本按钮，不是弹层触发器；
 *   · 点开后是【整页路由】 /hire/job/create/{step}/{id}?create_job_from=under_associate_hc，
 *     step 0/1/2 分别是 基础信息 / 职位设置 / 负责人 —— 步骤号在 URL 里；
 *   · 头部按钮：step0 只有「下一步」；step1 有「上一步」+「下一步」；step2 是「保存并完成更多设置」；
 *   · 选中值的节点类名是 ud__select__selector__selectItem（不是 selection-item）；
 *   · 工作地点是【多选树】，重复点同一节点 = 取消选中；
 *   · 月薪范围是 min输入 + max输入 + 币种下拉三段，缺任一都报「月薪为必填」；
 *   · 招聘数量 / 部门 / 招聘负责人 由飞书自动带值。
 *
 * 场景（?scn=）：
 *   A  审批通过 + 薪资可解析     → 一键应当走完三步并停在提交前
 *   B  审批中                    → 门禁应当拦下，不进向导
 *   C  同 A，但工作地点预置两个 tag（上海/北京）→ 配合 force 模式验证"重复点不会取消选中"
 *   D  审批通过但薪资"面议"      → 第1步应当被「月薪为必填」拦住，报告里要带这句原话
 * ──────────────────────────────────────────────────────────────────────────── */

var SCN = (new URLSearchParams(location.search).get('scn') || 'A').toUpperCase();
var JOB_ID = '7000000000000000001';

var REQ = {
  '需求名称': '资深前端工程师-自动化测试勿用',
  '需求编号': 'R00057',
  '审批状态': (SCN === 'B') ? '审批中' : '审批通过',
  '招聘类型': '社招',
  '人员类型': '正式',
  '需求部门': 'ACME',
  '职位类别': '软件研发',
  '工作地点': '北京',
  '职能类型': '前端开发',
  '职级': 'P6~P8',
  '学历要求': '本科',
  '经验要求': '3-5年',
  '需求人数': '2',
  '薪资范围': (SCN === 'D') ? '面议' : '20-35K',
  '用人经理': '张三',
  '职位职责': '1、负责前端架构设计与核心模块开发；\n2、推动工程化建设，提升交付效率；\n3、参与技术方案评审。',
  '职位要求': '1、本科及以上学历，5年以上前端经验；\n2、精通 TypeScript 与主流框架；\n3、有大型项目架构经验者优先。'
};

/* ── 组件工厂 ─────────────────────────────────────────────────────────────── */
var uid = 0;
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function item(label, required) {
  var it = el('div', 'ud-formily-item');
  it.appendChild(el('div', 'ud-formily-item-label', label + (required ? ' *' : '')));
  var ctl = el('div', 'ud-formily-item-control');
  it.appendChild(ctl);
  it._ctl = ctl;
  it._name = label;
  return it;
}
function help(it, msg) {
  var old = it.querySelector('.ud-formily-item-help');
  if (old) old.remove();
  if (msg) it.appendChild(el('div', 'ud-formily-item-help', msg));
}

/** UD 风格下拉：单选或多选（树）。options 为字符串数组。 */
function mkSelect(opts, multi, isTree, preset) {
  var sel = el('div', 'ud__select__selector');
  if (isTree) sel.classList.add('ud__treeSelect__selector');
  var ph = el('span', 'ud__select__selector__placeholder', '请选择');
  var search = document.createElement('input');
  search.type = 'text';
  search.className = 'ud__select__selector__search__input';
  search.style.cssText = 'border:none;outline:none;width:60px;font:inherit';
  sel._values = [];
  sel._multi = !!multi;

  function paint() {
    [].slice.call(sel.querySelectorAll('.ud__select__selector__selectItem')).forEach(function (n) { n.remove(); });
    sel._values.forEach(function (v) {
      var tag = el('span', 'ud__select__selector__selectItem', v + (multi ? ' ✕' : ''));
      sel.insertBefore(tag, search);
    });
    ph.style.display = sel._values.length ? 'none' : '';
    search.value = '';
  }
  sel.appendChild(ph);
  sel.appendChild(search);
  sel._set = function (v) {
    if (multi) { if (sel._values.indexOf(v) === -1) sel._values.push(v); }
    else sel._values = [v];
    paint();
  };
  sel._toggle = function (v) {
    if (!multi) { sel._values = [v]; paint(); return; }
    var i = sel._values.indexOf(v);
    if (i >= 0) sel._values.splice(i, 1); else sel._values.push(v);
    paint();
  };
  sel._get = function () { return sel._values.slice(); };
  (preset || []).forEach(function (p) { sel._set(p); });

  var dd = null;
  function close() { if (dd) { dd.remove(); dd = null; } }
  // 真机行为：点外面（document 上的 pointerdown）才关得掉，只派发 click 关不掉
  document.addEventListener('pointerdown', function (e) {
    if (!dd) return;
    if (sel.contains(e.target) || dd.contains(e.target)) return;
    close();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); }, true);

  sel.addEventListener('pointerdown', function (e) {
    if (dd) return;
    e.stopPropagation();
    dd = el('div', 'ud__select__dropdown');
    if (isTree) dd.classList.add('ud__treeSelect__overlay');
    var r = sel.getBoundingClientRect();
    dd.style.left = (r.left + window.scrollX) + 'px';
    dd.style.top = (r.bottom + window.scrollY + 2) + 'px';
    function render(filter) {
      dd.innerHTML = '';
      var shown = opts.filter(function (o) { return !filter || o.indexOf(filter) !== -1; });
      // 真机保真：树首屏只渲染前 9 个节点，找不到就得靠搜索框过滤
      if (isTree && !filter) shown = shown.slice(0, 9);
      shown.forEach(function (o) {
        var n = el('div', isTree ? 'ud__tree__node' : 'ud__select__list__item');
        var inner = el('div', isTree ? 'ud__tree__node__title' : 'ud__select__list__item__content', o);
        n.appendChild(inner);
        n.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (multi) sel._toggle(o); else sel._set(o);
          if (!multi) close();
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        });
        dd.appendChild(n);
      });
      if (!shown.length) dd.appendChild(el('div', 'ud__select__empty', '无匹配'));
    }
    render('');
    search.oninput = function () { render(search.value.trim()); };
    document.body.appendChild(dd);
  });
  return sel;
}

function mkRadio(name, opts, preset) {
  var wrap = el('div', 'ud__radio__group');
  opts.forEach(function (o) {
    var lab = el('label', 'ud__radio');
    var inp = document.createElement('input');
    inp.type = 'radio';
    inp.name = name + (++uid === 0 ? '' : '_' + name);
    inp.value = o;
    if (preset === o) { inp.checked = true; lab.classList.add('ud__radio--checked'); }
    lab.appendChild(inp);
    lab.appendChild(document.createTextNode(o));
    lab.addEventListener('click', function () {
      [].slice.call(wrap.querySelectorAll('.ud__radio')).forEach(function (l) { l.classList.remove('ud__radio--checked'); });
      [].slice.call(wrap.querySelectorAll('input')).forEach(function (i) { i.checked = false; });
      inp.checked = true;
      lab.classList.add('ud__radio--checked');
      wrap.dispatchEvent(new Event('change', { bubbles: true }));
    });
    wrap.appendChild(lab);
  });
  wrap._get = function () {
    var c = wrap.querySelector('input:checked');
    return c ? c.value : '';
  };
  return wrap;
}

function mkSwitch(on) {
  var s = el('span', 'ud__switch' + (on ? ' ud__switch--checked' : ''));
  s.setAttribute('role', 'switch');
  s.setAttribute('aria-checked', on ? 'true' : 'false');
  s.addEventListener('click', function () {
    var now = s.getAttribute('aria-checked') === 'true';
    s.setAttribute('aria-checked', now ? 'false' : 'true');
    s.classList.toggle('ud__switch--checked', !now);
  });
  return s;
}

function mkInput(type, preset, ph) {
  var i = document.createElement('input');
  i.type = type || 'text';
  if (preset != null) i.value = preset;
  if (ph) i.placeholder = ph;
  return i;
}

/* ── 表单状态（跨步骤保留，模拟 SPA 受控组件）───────────────────────────── */
var FORM = {};
function keep(step, name, node) { FORM[step + '|' + name] = node; return node; }
function got(step, name) { return FORM[step + '|' + name]; }

/* ── 三步向导的字段定义 ──────────────────────────────────────────────────── */
function buildStep0() {
  var box = el('div', 'wizard-step');
  function add(it, ctl) { it._ctl.appendChild(ctl); box.appendChild(it); return it; }

  var i1 = item('职位名称', true); add(i1, keep(0, '职位名称', mkInput('text')));
  var i2 = item('设置为虚拟职位', false); add(i2, keep(0, '虚拟职位', mkSwitch(false)));
  var i3 = item('职位类型', true); add(i3, keep(0, '职位类型', mkRadio('jobtype', ['社招', '校招'], '')));
  var i4 = item('雇佣类型', true); add(i4, keep(0, '雇佣类型', mkSelect(['全职', '实习', '外包', '劳务', '顾问'])));
  var i5 = item('职位类别', true);
  add(i5, keep(0, '职位类别', mkSelect(['房地产 / 建筑 / 物业', '政府机关 / 事业单位', '软件研发', '硬件研发', '数据科学'], false, true)));
  var i6 = item('部门', true);
  // 真机：飞书自动带上需求所属部门
  add(i6, keep(0, '部门', mkSelect(['ACME', '研发中心', '研发中心-软件平台部'], false, true, ['ACME'])));
  var i7 = item('工作地点', true);
  // 真机：多选树，选中后是可删 tag；重复点同一节点 = 取消选中
  var locPreset = (SCN === 'C') ? ['上海', '北京'] : [];
  add(i7, keep(0, '工作地点', mkSelect(['北京 · 测试离岸办公地点', '上海', '北京', '杭州', '成都', '武汉', '西安', '深圳', '广州', '南京'], true, true, locPreset)));
  var i8 = item('职能分类', false); add(i8, keep(0, '职能分类', mkSelect(['前端开发', '后端开发', '测试开发'])));
  var i9 = item('职级范围', false);
  // 真机：同一个表单项里【两个】下拉，起 - 止
  i9._ctl.appendChild(keep(0, '职级起', mkSelect(['P5', 'P6', 'P7', 'P8', 'P9'])));
  i9._ctl.appendChild(el('span', 'sep', '-'));
  i9._ctl.appendChild(keep(0, '职级止', mkSelect(['P5', 'P6', 'P7', 'P8', 'P9'])));
  box.appendChild(i9);
  var i10 = item('学历要求', false); add(i10, keep(0, '学历要求', mkSelect(['大专', '本科', '硕士', '博士'])));
  var i11 = item('工作年限', false); add(i11, keep(0, '工作年限', mkSelect(['1-3年', '3-5年', '5-10年', '10年以上'])));
  var i12 = item('招聘数量', false); add(i12, keep(0, '招聘数量', mkInput('number', '100')));  // 真机：飞书已带值
  var i13 = item('月薪范围', true);
  // 真机三段：min 输入 + max 输入 + 币种下拉，缺任一都报「月薪为必填」
  i13._ctl.appendChild(keep(0, '月薪下限', mkInput('text')));
  i13._ctl.appendChild(el('span', 'salary-unit', 'K'));
  i13._ctl.appendChild(el('span', 'sep', '-'));
  i13._ctl.appendChild(keep(0, '月薪上限', mkInput('text')));
  i13._ctl.appendChild(el('span', 'salary-unit', 'K'));
  i13._ctl.appendChild(keep(0, '币种', mkSelect(['CNY-人民币', 'USD-美元', 'GBP-英镑', 'HKD-港币', 'EUR-欧元', 'JPY-日元'])));
  box.appendChild(i13);
  var i14 = item('招聘计划渠道', false); add(i14, keep(0, '招聘计划渠道', mkSelect(['内部推荐', '猎头', '官网'])));
  var i15 = item('职位描述', false);
  var ta = document.createElement('textarea');
  ta.rows = 6; ta.style.width = '100%';
  add(i15, keep(0, '职位描述', ta));
  box._items = { 职位名称: i1, 职位类型: i3, 雇佣类型: i4, 职位类别: i5, 部门: i6, 工作地点: i7, 月薪范围: i13 };
  return box;
}

function buildStep1() {
  var box = el('div', 'wizard-step');
  var i1 = item('招聘流程', true);
  i1._ctl.appendChild(keep(1, '招聘流程', mkSelect(['默认社招流程', '外包人员招聘流程', '（海外）ACME社招流程'])));
  box.appendChild(i1);
  var i2 = item('Offer 申请表', true);
  i2._ctl.appendChild(keep(1, 'Offer申请表', mkSelect(['默认 Offer 申请表'], false, false, ['默认 Offer 申请表'])));
  box.appendChild(i2);
  var i3 = item('发件邮箱', true);
  i3._ctl.appendChild(keep(1, '发件邮箱', mkSelect(['noreply-hire@mail.feishu.cn'], false, false, ['noreply-hire@mail.feishu.cn'])));
  box.appendChild(i3);
  var i4 = item('评估通过，自动进入下一阶段', false);
  i4._ctl.appendChild(keep(1, '自动进入', mkRadio('autoNext',
    ['当全部评估人选择通过时', '当任意 1 个评估人选择通过时', '当任意 2 个评估人选择通过时', '当任意 3 个评估人选择通过时'],
    '当全部评估人选择通过时')));
  box.appendChild(i4);
  box._items = { 招聘流程: i1 };
  return box;
}

function buildStep2() {
  var box = el('div', 'wizard-step');
  var i1 = item('招聘负责人', true);
  i1._ctl.appendChild(keep(2, '招聘负责人', mkSelect(['杨承鹏', '张三', '李四'], true, false, ['杨承鹏'])));  // 真机：已预填当前用户
  box.appendChild(i1);
  var i2 = item('用人经理', true);
  i2._ctl.appendChild(keep(2, '用人经理', mkSelect(['张三', '李四', '王五'], true, false)));
  box.appendChild(i2);
  var i3 = item('招聘协助人', false);
  i3._ctl.appendChild(keep(2, '招聘协助人', mkSelect(['张三', '李四', '王五'], true, false)));
  box.appendChild(i3);
  box._items = { 用人经理: i2 };
  return box;
}

var STEP_BUILDERS = [buildStep0, buildStep1, buildStep2];
var STEP_NAMES = ['基础信息', '职位设置', '负责人'];
var stepCache = {};

/* ── 校验：与真机同构（缺必填就报红字且不前进）───────────────────────────── */
function validate(step, box) {
  var ok = true;
  function bad(it, msg) { help(it, msg); ok = false; }
  function good(it) { help(it, ''); }
  if (step === 0) {
    var I = box._items;
    if (!got(0, '职位名称').value.trim()) bad(I.职位名称, '职位名称为必填'); else good(I.职位名称);
    if (!got(0, '职位类型')._get()) bad(I.职位类型, '职位类型为必填'); else good(I.职位类型);
    if (!got(0, '雇佣类型')._get().length) bad(I.雇佣类型, '雇佣类型为必填'); else good(I.雇佣类型);
    if (!got(0, '职位类别')._get().length) bad(I.职位类别, '职位类别为必填'); else good(I.职位类别);
    if (!got(0, '部门')._get().length) bad(I.部门, '部门为必填'); else good(I.部门);
    if (!got(0, '工作地点')._get().length) bad(I.工作地点, '工作地点为必填'); else good(I.工作地点);
    // 真机原话就是「月薪为必填」，三段缺一即报
    var lo = got(0, '月薪下限').value.trim(), hi = got(0, '月薪上限').value.trim(), cur = got(0, '币种')._get().length;
    if (!lo || !hi || !cur) bad(I.月薪范围, '月薪为必填'); else good(I.月薪范围);
  } else if (step === 1) {
    if (!got(1, '招聘流程')._get().length) bad(box._items.招聘流程, '招聘流程为必填'); else good(box._items.招聘流程);
  }
  return ok;
}

/* ── 路由 ────────────────────────────────────────────────────────────────── */
function go(path) { history.pushState({}, '', path); render(); }

function renderRequirement() {
  var app = document.getElementById('app');
  app.innerHTML = '';
  // 真机保真（2026-08-04 实测 R00057）：需求详情是整页路由、无弹层，且【基本信息块里没有
  // 「需求名称」这一行】—— 需求名只出现在页面标题/页头。工具必须靠 title 兜底才拿得到它。
  document.title = REQ['需求名称'] + ' - 招聘需求';
  var detail = el('div', 'jrDetail__k3n');

  var sub = el('div', 'jrSubInfo__p1q');
  var lb = el('div', 'label__f8a', '审批状态:');
  var vv = el('div', 'val__c2b', REQ['审批状态']);
  sub.appendChild(lb); sub.appendChild(vv);
  detail.appendChild(sub);

  var basic = el('div', 'basicInfo__z9m');
  basic.appendChild(el('h3', 'blockTitle__t', '基本信息'));
  Object.keys(REQ).forEach(function (k) {
    // 审批状态在上面的 jrSubInfo 里；需求名称真机上不在基本信息块内（见 renderRequirement 注释）
    if (k === '审批状态' || k === '需求名称') return;
    var row = el('div', 'row');
    row.appendChild(el('div', 'label__f8a', k));
    row.appendChild(el('div', 'val__c2b', REQ[k]));
    basic.appendChild(row);
  });
  detail.appendChild(basic);

  // 关联职位区块：真机上「新建职位」就在这里。
  // ⚠️ 保真关键：这里【必须】放几条真实的关联职位行。真机实测（R00057）它们形态上就是标准的
  // label-value 行（职位名 → 工作地点），会被只读提取当成需求字段抓走：
  //   示例岗位A=华东地区ACME、内部招聘=华北地区ACME、校园招聘=华东地区ACME…
  // 其中「校园招聘」恰好与需求名同名，混进来极具误导性。工具必须按区块标题把整块排除掉。
  var rel = el('div', 'relatedJobsCard__w2');
  rel.appendChild(el('h3', 'blockTitle__t', '关联职位'));
  [['示例岗位A', '华东地区ACME'], ['内部招聘', '华北地区ACME'],
    ['校园招聘', '华东地区ACME'], ['校招- CY', '华东地区市场拓展事业部']].forEach(function (p) {
    var row = el('div', 'row');
    row.appendChild(el('div', 'label__f8a', p[0]));
    row.appendChild(el('div', 'val__c2b', p[1]));
    rel.appendChild(row);
  });
  var btnBox = el('div', 'rrjHeaderButtonsContainer__b7');
  var nb = el('button', 'ud__button ud__button--text', '新建职位');
  nb.addEventListener('click', function () {
    go('/hire/job/create/0/' + JOB_ID + '?create_job_from=under_associate_hc' + '&scn=' + SCN);
  });
  btnBox.appendChild(nb);
  rel.appendChild(btnBox);
  detail.appendChild(rel);

  // 招聘进展区块：同样不是需求字段（真机上会被抓成「招聘进展 = Offer 沟通1 待入职2 已入职2」）
  var prog = el('div', 'progressCard__p3');
  prog.appendChild(el('h3', 'blockTitle__t', '招聘进展'));
  var prow = el('div', 'row');
  prow.appendChild(el('div', 'label__f8a', 'Offer 沟通'));
  prow.appendChild(el('div', 'val__c2b', '1'));
  prog.appendChild(prow);
  detail.appendChild(prog);

  app.appendChild(detail);
}

function renderWizard(step) {
  var app = document.getElementById('app');
  app.innerHTML = '';
  document.title = '新建职位';

  var bar = el('header', 'bar');
  bar.appendChild(el('div', 'title', '新建职位'));
  var steps = el('div', 'ud__steps');
  STEP_NAMES.forEach(function (n, i) {
    var s = el('div', 'ud__steps__item' + (i === step ? ' ud__steps__item--active' : ''));
    s.appendChild(el('div', 'ud__steps__item-title-inner', n));
    steps.appendChild(s);
  });
  bar.appendChild(steps);

  var btns = el('div', 'btns');
  if (step > 0) {
    var prev = el('button', 'ud__button', '上一步');
    prev.addEventListener('click', function () { go(wizardPath(step - 1)); });
    btns.appendChild(prev);
  }
  if (step < 2) {
    var next = el('button', 'ud__button ud__button--primary', '下一步');
    next.addEventListener('click', function () {
      var box = stepCache[step];
      if (!validate(step, box)) return;      // 真机：被必填拦住时页面【不动】
      go(wizardPath(step + 1));
    });
    btns.appendChild(next);
  } else {
    var submit = el('button', 'ud__button ud__button--primary', '保存并完成更多设置');
    submit.id = 'fixture-submit';
    submit.addEventListener('click', function () {
      document.documentElement.setAttribute('data-submitted', '1');
    });
    btns.appendChild(submit);
  }
  bar.appendChild(btns);
  app.appendChild(bar);

  if (!stepCache[step]) stepCache[step] = STEP_BUILDERS[step]();
  app.appendChild(stepCache[step]);
}

function wizardPath(step) {
  return '/hire/job/create/' + step + '/' + JOB_ID + '?create_job_from=under_associate_hc&scn=' + SCN;
}

/* 真机保真（2026-08-04 实测）：飞书招聘的入口首页是 /hire/home，从工作台进来先落这里，
 * 再【页内 pushState】进 /hire/job/...（无整页加载）。插件 matches 若写成 /hire/job* 则
 * 首页上不注入、后续也没机会注入 —— 本夹具必须能复现这条用户真实路径。 */
function renderHome() {
  var app = document.getElementById('app');
  app.innerHTML = '';
  document.title = '飞书招聘';
  var bar = el('header', 'bar');
  bar.appendChild(el('div', 'title', '飞书招聘 · 首页'));
  app.appendChild(bar);
  var nav = el('div', 'homeNav__x1');
  var go1 = el('button', 'ud__button', '招聘需求');
  go1.id = 'fixture-nav-requirements';
  go1.addEventListener('click', function () {
    go('/hire/job/requirement/7553536895138908459' + location.search);
  });
  nav.appendChild(go1);
  app.appendChild(nav);
}

function render() {
  if (/\/hire\/home/.test(location.pathname)) { renderHome(); return; }
  var m = /\/hire\/job\/create\/(\d+)/.exec(location.pathname);
  if (m) renderWizard(parseInt(m[1], 10));
  else renderRequirement();
}
window.addEventListener('popstate', render);
