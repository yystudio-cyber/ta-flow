# ═══════════════════════════════════════════════════════════════════
# 猎聘 RPA 配置模板
#
# 用法：复制成 configs/config_<你的岗位>_<日期>.yaml 后按需修改。
# 这个仓库不带任何真实岗位/公司池 —— 下面全是占位示例。
# ═══════════════════════════════════════════════════════════════════

login:
  manual_login: true
  manual_login_wait_seconds: 120
  use_saved_cookies: true
  # ⚠️ cookies 含登录态，已在 .gitignore 排除，不要提交、不要外发
  cookies_file: "liepin_cookies.json"

search:
  entry_url: "https://lpt.liepin.com/search"

  # 目标公司池：你希望优先命中的同行/竞对公司。
  # 留空表示不限公司，只按关键词搜。
  target_companies:
    - "示例科技"
    - "示例科技（上海）"
    - "另一家示例公司"

  # 搜索关键词。建议每个方向 3~8 条，覆盖：岗位名 + 技术栈 + 业务域
  keywords:
    - "后端开发工程师"
    - "Java 后端 高并发"
    - "分布式系统 微服务"
    - "Python 后端 平台开发"

  # 地理范围，留空表示全国
  locations:
    - "上海"

  # 行业筛选，留空表示不限
  industries:
    - ""

  # 经验要求，留空表示不限（例如 "3-5年"）
  experience: ""

  # 学历要求，留空表示不限（例如 "本科"）
  education: ""

  max_pages: 4
  strict_filters: false

# ── 以下为可选行为，不配则用默认值 ──
output:
  # 候选人清单落盘目录；相对路径基于本配置文件所在目录
  dir: "../outputs"
  # 添加 .gitignore 排除，防止候选人数据进版本库
  write_csv: true
  write_json: true

risk:
  # 停在多少个页面后强制冷却（秒）
  cooldown_every_pages: 40
  cooldown_seconds: 300
  # 命中风控信号的判定
  abort_on_captcha: true
  abort_on_ban_text: true
